<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>视频标注工具</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: system-ui; background:#1a1a2e; color:#eee; display:flex; height:100vh; }
.sidebar { width:280px; background:#16213e; padding:16px; display:flex; flex-direction:column; gap:10px; overflow-y:auto; }
.sidebar h2 { font-size:13px; color:#888; text-transform:uppercase; margin-bottom:2px; }
.sidebar select, .sidebar button { width:100%; padding:8px; border-radius:6px; border:1px solid #333; background:#0f3460; color:#eee; cursor:pointer; font-size:13px; }
.sidebar button:hover { background:#1a508b; }
.sidebar button.primary { background:#2563eb; border-color:#2563eb; }
.sidebar button.primary:hover { background:#1d4ed8; }
.sidebar button.coach { background:#7c3aed; border-color:#7c3aed; }
.sidebar button.coach:hover { background:#6d28d9; }
.sidebar button.coach.doubt { background:#d97706; border-color:#d97706; }
.sidebar button.coach.doubt:hover { background:#b45309; }
.sidebar button.frame-nav { background:#0f3460; font-size:12px; }
.label-btns { display:flex; flex-direction:column; gap:6px; }
.label-btn { padding:8px 12px; border:2px solid #333; border-radius:6px; background:transparent; color:#ccc; cursor:pointer; text-align:left; font-size:13px; }
.label-btn.selected { border-color:#4fc3f7; background:rgba(79,195,247,0.15); color:#4fc3f7; }
.main-area { flex:1; display:flex; flex-direction:column; padding:16px; gap:8px; }
.video-container { flex:1; position:relative; background:#000; border-radius:10px; border:1px solid #333; overflow:hidden; display:flex; align-items:center; justify-content:center; }
.video-container video { max-width:100%; max-height:100%; }
.video-container canvas { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); cursor:crosshair; }
.frame-controls { display:flex; align-items:center; gap:12px; background:#16213e; padding:10px 16px; border-radius:10px; }
.frame-controls button { padding:6px 14px; border-radius:6px; border:1px solid #333; background:#0f3460; color:#eee; cursor:pointer; font-size:13px; }
.frame-controls button:hover { background:#1a508b; }
.frame-controls .frame-display { font-size:14px; color:#4fc3f7; font-family: monospace; min-width:80px; }
.frame-controls input[type=range] { flex:1; accent-color:#4fc3f7; }
.frame-list { background:#16213e; border-radius:10px; padding:12px; max-height:120px; overflow-y:auto; }
.frame-list h3 { font-size:12px; color:#888; margin-bottom:6px; }
.frame-item { display:flex; justify-content:space-between; align-items:center; padding:4px 8px; background:#0f3460; border-radius:4px; margin-bottom:4px; font-size:12px; }
.frame-item .del { color:#f87171; cursor:pointer; font-weight:bold; }
.info { font-size:12px; color:#888; text-align:center; }
.result-panel { width:320px; background:#16213e; padding:16px; overflow-y:auto; display:none; }
.result-panel.show { display:block; }
.result-panel h2 { font-size:14px; color:#888; text-transform:uppercase; margin-bottom:10px; }
.score-card { background:#0f3460; border-radius:10px; padding:14px; margin-bottom:10px; }
.score-row { display:flex; justify-content:space-between; align-items:center; padding:4px 0; border-bottom:1px solid #1e293b; }
.score-row:last-child { border:none; }
.score-label { font-size:12px; color:#94a3b8; }
.score-value { font-size:20px; font-weight:700; }
.score-value.good { color:#4ade80; }
.score-value.warn { color:#fbbf24; }
.score-value.bad { color:#f87171; }
.fb-item { padding:8px 10px; border-radius:6px; font-size:12px; margin-bottom:6px; border-left:3px solid; line-height:1.4; }
.fb-item.correct { background:rgba(74,222,128,0.08); border-color:#4ade80; }
.fb-item.extra { background:rgba(248,113,113,0.08); border-color:#f87171; }
.fb-item.missed { background:rgba(251,191,36,0.08); border-color:#fbbf24; }
.task-type-tabs { display:flex; gap:4px; margin-bottom:8px; }
.task-type-tabs button { flex:1; padding:6px; border-radius:4px; border:1px solid #333; background:#0f3460; color:#ccc; cursor:pointer; font-size:11px; }
.task-type-tabs button.active { background:#2563eb; border-color:#2563eb; color:#fff; }
</style>
</head>
<body>

<div class="sidebar">
  <h2>选择任务</h2>
  <div class="task-type-tabs">
    <button class="active" onclick="switchTaskGroup('tracking')">目标跟踪</button>
    <button onclick="switchTaskGroup('event')">事件检测</button>
  </div>
  <select id="taskSelect" onchange="loadTask()">
    <option value="task15">任务15: 目标跟踪入门 (★简单)</option>
    <option value="task16">任务16: 多目标跟踪 (★★★困难)</option>
    <option value="task17">任务17: 视频事件检测 (★★中等)</option>
    <option value="task18">任务18: 复杂场景事件 (★★★困难)</option>
  </select>

  <h2>选择标签</h2>
  <div class="label-btns" id="labelBtns"></div>

  <button class="primary" onclick="checkAnnotation()">检查标注</button>
  <button onclick="undoBox()">撤销本帧框</button>
  <button onclick="clearFrame()">清除本帧</button>
  <button onclick="clearAll()">清除全部帧</button>
  <button class="coach" id="btnCoach" onclick="askCoach()" style="display:none">问Coach：帮我分析</button>
  <button class="coach doubt" id="btnDoubt" onclick="askDoubt()">这里有疑问</button>
</div>

<div class="main-area">
  <div class="video-container" id="videoContainer">
    <video id="videoPlayer" ontimeupdate="onVideoTime()" style="display:none"></video>
    <canvas id="videoCanvas"></canvas>
  </div>

  <div class="frame-controls">
    <button onclick="prevFrame()">◀ 上一帧</button>
    <span class="frame-display" id="frameDisplay">帧 0 / 0</span>
    <button onclick="nextFrame()">下一帧 ▶</button>
    <input type="range" id="frameSlider" min="0" max="0" value="0" oninput="goToFrame(this.value)">
    <button onclick="toggleVideoPlay()" id="btnVideoPlay">▶ 播放</button>
    <button onclick="saveCurrentFrame()" id="btnSaveFrame">保存当前帧标注</button>
  </div>

  <div class="frame-list">
    <h3>已标注的帧</h3>
    <div id="frameList">尚未标注任何帧</div>
  </div>
  <div class="info" id="info">在视频上拖动画框，选好标签后点「保存当前帧标注」，标注完所有帧后「检查标注」</div>
</div>

<div class="result-panel" id="resultPanel">
  <div id="resultContent"></div>
</div>

<script>
const TASKS = {
  task15: {
    url: '/video/sample1.mp4', labels: ['car','person'], duration: 5, fps: 1,
    desc: '视频目标跟踪 — 逐帧标注汽车位置 (5帧)', difficulty: '简单',
    type: 'video_tracking', totalFrames: 5,
    gt: [
      {"frame":0,"boxes":[{"x":248,"y":183,"w":219,"h":174,"label":"car"}]},
      {"frame":1,"boxes":[{"x":252,"y":180,"w":222,"h":177,"label":"car"}]},
      {"frame":2,"boxes":[{"x":260,"y":178,"w":228,"h":180,"label":"car"},{"x":534,"y":167,"w":52,"h":110,"label":"person"}]},
      {"frame":3,"boxes":[{"x":266,"y":175,"w":234,"h":183,"label":"car"},{"x":542,"y":163,"w":55,"h":114,"label":"person"}]},
      {"frame":4,"boxes":[{"x":270,"y":172,"w":240,"h":186,"label":"car"},{"x":550,"y":160,"w":58,"h":118,"label":"person"}]}
    ]
  },
  task16: {
    url: '/video/sample2.mp4', labels: ['car','person','bicycle'], duration: 10, fps: 1,
    desc: '多目标跟踪 — 逐帧标注多目标 (10帧)', difficulty: '困难',
    type: 'video_tracking', totalFrames: 10,
    gt: [
      {"frame":0,"boxes":[{"x":200,"y":300,"w":150,"h":120,"label":"car"},{"x":500,"y":250,"w":40,"h":90,"label":"person"}]},
      {"frame":1,"boxes":[{"x":205,"y":298,"w":152,"h":122,"label":"car"},{"x":505,"y":248,"w":42,"h":92,"label":"person"}]},
      {"frame":2,"boxes":[{"x":210,"y":295,"w":155,"h":124,"label":"car"},{"x":510,"y":245,"w":44,"h":94,"label":"person"},{"x":70,"y":310,"w":60,"h":55,"label":"bicycle"}]},
      {"frame":3,"boxes":[{"x":215,"y":292,"w":158,"h":126,"label":"car"},{"x":515,"y":242,"w":46,"h":96,"label":"person"},{"x":75,"y":308,"w":62,"h":57,"label":"bicycle"}]},
      {"frame":4,"boxes":[{"x":222,"y":290,"w":160,"h":128,"label":"car"},{"x":520,"y":240,"w":48,"h":98,"label":"person"},{"x":82,"y":305,"w":65,"h":60,"label":"bicycle"}]},
      {"frame":5,"boxes":[{"x":228,"y":287,"w":163,"h":130,"label":"car"},{"x":80,"y":303,"w":68,"h":63,"label":"bicycle"}]},
      {"frame":6,"boxes":[{"x":235,"y":285,"w":165,"h":132,"label":"car"},{"x":78,"y":300,"w":70,"h":66,"label":"bicycle"}]},
      {"frame":7,"boxes":[{"x":240,"y":282,"w":168,"h":135,"label":"car"},{"x":530,"y":235,"w":50,"h":100,"label":"person"}]},
      {"frame":8,"boxes":[{"x":245,"y":280,"w":170,"h":137,"label":"car"},{"x":535,"y":232,"w":52,"h":102,"label":"person"}]},
      {"frame":9,"boxes":[{"x":250,"y":278,"w":172,"h":140,"label":"car"},{"x":540,"y":230,"w":54,"h":104,"label":"person"}]}
    ]
  },
  task17: {
    url: '/video/sample3.mp4', labels: ['traffic_light_red','traffic_light_green','pedestrian_crossing'],
    duration: 12, desc: '视频事件检测 — 标出信号灯颜色变化和行人穿行时间段', difficulty: '中等',
    type: 'video_event',
    gt: [
      {"start_time":0,"end_time":5.5,"label":"traffic_light_green"},
      {"start_time":5.5,"end_time":12,"label":"traffic_light_red"},
      {"start_time":6,"end_time":10,"label":"pedestrian_crossing"}
    ]
  },
  task18: {
    url: '/video/sample4.mp4', labels: ['speaking','walking','running','standing'],
    duration: 15, desc: '复杂场景事件 — 标出人物行为时间段', difficulty: '困难',
    type: 'video_event',
    gt: [
      {"start_time":0,"end_time":3,"label":"standing"},
      {"start_time":1.5,"end_time":5,"label":"speaking"},
      {"start_time":3.5,"end_time":8,"label":"walking"},
      {"start_time":8.5,"end_time":12,"label":"running"},
      {"start_time":12.5,"end_time":15,"label":"standing"}
    ]
  }
};

const COLORS = { car:'#E74C3C', horse:'#8E44AD', person:'#3B82F6', bicycle:'#10B981', traffic_light_red:'#EF4444', traffic_light_green:'#22C55E', pedestrian_crossing:'#F59E0B', speaking:'#8B5CF6', walking:'#06B6D4', running:'#F97316', standing:'#6B7280' };
const LABEL_CN = { car:'车', person:'行人', bicycle:'自行车', traffic_light_red:'红灯', traffic_light_green:'绿灯', pedestrian_crossing:'行人穿行', speaking:'说话', walking:'行走', running:'跑步', standing:'站立' };

let currentTask = 'task15', selectedLabel = '', taskGroup = 'tracking';
let frameBoxes = {}; // {frameIdx: [boxes]}
let currentFrame = 0, totalFrames = 5;
let checkResult = null;
let drawing = false, drawStart = null, currentDrawing = null;
let eventMode = false; // for video_event type

const video = document.getElementById('videoPlayer');
const canvas = document.getElementById('videoCanvas');
const ctx = canvas.getContext('2d');
const resultPanel = document.getElementById('resultPanel');
const resultContent = document.getElementById('resultContent');

function switchTaskGroup(group) {
  taskGroup = group;
  document.querySelectorAll('.task-type-tabs button').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.task-type-tabs button').forEach(b => {
    if ((group === 'tracking' && b.textContent === '目标跟踪') || (group === 'event' && b.textContent === '事件检测')) b.classList.add('active');
  });
  const sel = document.getElementById('taskSelect');
  if (group === 'tracking') {
    sel.innerHTML = '<option value="task15">任务15: 目标跟踪入门 (★简单)</option><option value="task16">任务16: 多目标跟踪 (★★★困难)</option>';
    sel.value = 'task15';
  } else {
    sel.innerHTML = '<option value="task17">任务17: 视频事件检测 (★★中等)</option><option value="task18">任务18: 复杂场景事件 (★★★困难)</option>';
    sel.value = 'task17';
  }
  loadTask();
}

function loadTask() {
  currentTask = document.getElementById('taskSelect').value;
  const t = TASKS[currentTask];
  selectedLabel = t.labels[0];
  frameBoxes = {}; checkResult = null; currentFrame = 0;
  drawing = false; drawStart = null; currentDrawing = null;
  resultPanel.classList.remove('show');
  document.getElementById('btnCoach').style.display = 'none';
  renderLabels();
  eventMode = t.type === 'video_event';
  totalFrames = t.totalFrames || 10;

  if (eventMode) {
    loadEventMode(t);
    return;
  }

  // Tracking mode
  document.getElementById('videoContainer').style.display = 'flex';
  document.getElementById('videoPlayer').style.display = 'none';
  document.getElementById('videoCanvas').style.display = 'block';
  document.getElementById('frameSlider').max = totalFrames - 1;
  document.getElementById('frameSlider').value = 0;
  document.getElementById('btnSaveFrame').style.display = 'inline-block';

  video.pause();
  video.src = t.url;

  // Use canvas as image display (no real video for demo)
  canvas.width = 800; canvas.height = 450;
  goToFrame(0);
  document.getElementById('info').textContent = t.desc + ' (' + (t.difficulty||'') + ')';
}

function goToFrame(idx) {
  currentFrame = Math.max(0, Math.min(totalFrames - 1, parseInt(idx) || 0));
  document.getElementById('frameDisplay').textContent = `帧 ${currentFrame} / ${totalFrames - 1}`;
  document.getElementById('frameSlider').value = currentFrame;
  drawFrame();
}

function nextFrame() { goToFrame(currentFrame + 1); }
function prevFrame() { goToFrame(currentFrame - 1); }

function drawFrame() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Placeholder background
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Grid
  ctx.strokeStyle = '#222';
  ctx.lineWidth = 0.5;
  for (let x = 0; x < canvas.width; x += 100) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke(); }
  for (let y = 0; y < canvas.height; y += 100) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke(); }

  // Frame number
  ctx.fillStyle = '#888';
  ctx.font = '40px system-ui';
  ctx.fillText(`帧 ${currentFrame}`, canvas.width / 2 - 60, canvas.height / 2);
  ctx.font = '14px system-ui';
  ctx.fillText('（视频文件加载后显示实际画面）', canvas.width / 2 - 120, canvas.height / 2 + 30);

  // Draw saved boxes
  const boxes = frameBoxes[currentFrame] || [];
  boxes.forEach(b => {
    ctx.strokeStyle = COLORS[b.label] || '#888';
    ctx.lineWidth = 2;
    ctx.strokeRect(b.x, b.y, b.w, b.h);
    ctx.fillStyle = (COLORS[b.label] || '#888') + '20';
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.fillStyle = COLORS[b.label] || '#888';
    ctx.font = '12px system-ui';
    ctx.fillText(LABEL_CN[b.label] || b.label, b.x + 4, b.y - 6);
  });

  // GT overlay after check
  if (checkResult) {
    const gtFrame = checkResult.gt[currentFrame];
    if (gtFrame) {
      const gtBoxes = gtFrame.boxes || [];
      gtBoxes.forEach(gt => {
        ctx.setLineDash([8, 4]);
        ctx.strokeStyle = '#4ade80';
        ctx.lineWidth = 2;
        ctx.strokeRect(gt.x, gt.y, gt.w, gt.h);
        ctx.setLineDash([]);
      });
    }
  }

  // Current drawing
  if (currentDrawing) {
    ctx.strokeStyle = COLORS[selectedLabel] || '#888';
    ctx.lineWidth = 3;
    ctx.strokeRect(currentDrawing.x, currentDrawing.y, currentDrawing.w, currentDrawing.h);
    ctx.fillStyle = (COLORS[selectedLabel] || '#888') + '20';
    ctx.fillRect(currentDrawing.x, currentDrawing.y, currentDrawing.w, currentDrawing.h);
  }

  renderFrameList();
}

function renderLabels() {
  const t = TASKS[currentTask];
  document.getElementById('labelBtns').innerHTML = t.labels.map(l => {
    const c = COLORS[l] || '#888', cn = LABEL_CN[l] || l;
    return `<button class="label-btn${selectedLabel===l?' selected':''}" onclick="selectLabel('${l}')" style="border-left:4px solid ${c}">${cn} (${l})</button>`;
  }).join('');
}

function selectLabel(l) { selectedLabel = l; renderLabels(); }

// Canvas drawing
canvas.addEventListener('mousedown', e => {
  if (checkResult) return;
  if (eventMode) return;
  const r = canvas.getBoundingClientRect();
  const sx = (e.clientX - r.left) * canvas.width / r.width;
  const sy = (e.clientY - r.top) * canvas.height / r.height;
  drawStart = { x: sx, y: sy };
  currentDrawing = { x: sx, y: sy, w: 0, h: 0 };
});
canvas.addEventListener('mousemove', e => {
  if (!currentDrawing) return;
  const r = canvas.getBoundingClientRect();
  const mx = (e.clientX - r.left) * canvas.width / r.width;
  const my = (e.clientY - r.top) * canvas.height / r.height;
  currentDrawing.x = Math.min(drawStart.x, mx);
  currentDrawing.y = Math.min(drawStart.y, my);
  currentDrawing.w = Math.abs(mx - drawStart.x);
  currentDrawing.h = Math.abs(my - drawStart.y);
  drawFrame();
});
canvas.addEventListener('mouseup', () => {
  if (!currentDrawing || currentDrawing.w < 8 || currentDrawing.h < 8) { currentDrawing = null; drawFrame(); return; }
  if (!frameBoxes[currentFrame]) frameBoxes[currentFrame] = [];
  frameBoxes[currentFrame].push({
    x: Math.round(currentDrawing.x), y: Math.round(currentDrawing.y),
    w: Math.round(currentDrawing.w), h: Math.round(currentDrawing.h),
    label: selectedLabel
  });
  currentDrawing = null;
  drawFrame();
});

function saveCurrentFrame() {
  document.getElementById('info').textContent = `帧 ${currentFrame} 已保存 ${(frameBoxes[currentFrame]||[]).length} 个框`;
}

function undoBox() {
  if (!frameBoxes[currentFrame] || frameBoxes[currentFrame].length === 0) return;
  frameBoxes[currentFrame].pop();
  drawFrame();
}

function clearFrame() {
  delete frameBoxes[currentFrame];
  drawFrame();
}

function clearAll() { frameBoxes = {}; checkResult = null; drawFrame(); renderResults(); }

function renderFrameList() {
  const el = document.getElementById('frameList');
  const fids = Object.keys(frameBoxes).map(Number).sort((a,b) => a - b);
  if (fids.length === 0) { el.innerHTML = '尚未标注任何帧'; return; }
  el.innerHTML = fids.map(fid => {
    const count = frameBoxes[fid]?.length || 0;
    return `<div class="frame-item"><span>帧 ${fid}: ${count} 个框</span><span class="del" onclick="delete frameBoxes[${fid}];drawFrame();renderFrameList()">✕</span></div>`;
  }).join('');
}

// IOU calculation
function calcIOU(a, b) {
  const ix = Math.max(0, Math.min(a.x+a.w, b.x+b.w) - Math.max(a.x, b.x));
  const iy = Math.max(0, Math.min(a.y+a.h, b.y+b.h) - Math.max(a.y, b.y));
  const u = (a.w*a.h) + (b.w*b.h) - ix*iy;
  return u > 0 ? (ix*iy)/u : 0;
}

function checkAnnotation() {
  const t = TASKS[currentTask];
  if (eventMode) { checkEventAnnotation(); return; }

  saveCurrentFrame();
  let totalPrecision = 0, totalRecall = 0, framesTracked = 0, framesCorrect = 0;
  const frameResults = [];

  t.gt.forEach((gtFrame, fi) => {
    const gtBoxes = gtFrame.boxes || [];
    const predBoxes = frameBoxes[fi] || [];
    if (gtBoxes.length === 0 && predBoxes.length === 0) return;
    framesTracked++;

    const pairs = [];
    predBoxes.forEach((p, pi) => gtBoxes.forEach((g, gj) => {
      if (p.label !== g.label) return;
      const iou = calcIOU(p, g);
      if (iou >= 0.5) pairs.push({ iou, pi, gj });
    }));
    pairs.sort((a,b) => b.iou - a.iou);
    const mPred = new Set(), mGt = new Set();
    pairs.forEach(({iou, pi, gj}) => { if (!mPred.has(pi) && !mGt.has(gj)) { mPred.add(pi); mGt.add(gj); } });

    const tp = mPred.size, fp = predBoxes.length - tp, fn = gtBoxes.length - tp;
    const precision = tp / predBoxes.length || 0, recall = tp / gtBoxes.length || 0;
    const f1 = (2*precision*recall)/(precision+recall) || 0;
    totalPrecision += precision; totalRecall += recall;
    if (f1 >= 0.5) framesCorrect++;
    frameResults.push({ frame: gtFrame.frame || fi, precision, recall, f1, tp, fp, fn });
  });

  const avgP = totalPrecision / framesTracked || 0;
  const avgR = totalRecall / framesTracked || 0;
  const avgF1 = 2 * avgP * avgR / (avgP + avgR) || 0;
  const frameAcc = framesCorrect / framesTracked || 0;

  checkResult = { gt: t.gt, f1: avgF1, precision: avgP, recall: avgR, frameAccuracy: frameAcc, framesTracked, framesCorrect, frameResults };
  drawFrame();
  renderTrackingResults();
  document.getElementById('btnCoach').style.display = 'block';
}

function renderTrackingResults() {
  if (!checkResult) { resultPanel.classList.remove('show'); return; }
  resultPanel.classList.add('show');
  const r = checkResult;

  let html = `
    <div class="score-card">
      <div class="score-row"><span class="score-label">平均精确率</span><span class="score-value ${r.precision>=0.7?'good':'warn'}">${(r.precision*100).toFixed(0)}%</span></div>
      <div class="score-row"><span class="score-label">平均召回率</span><span class="score-value ${r.recall>=0.7?'good':'warn'}">${(r.recall*100).toFixed(0)}%</span></div>
      <div class="score-row"><span class="score-label">平均 F1</span><span class="score-value ${r.f1>=0.7?'good':'warn'}">${(r.f1*100).toFixed(0)}%</span></div>
      <div class="score-row"><span class="score-label">帧正确率</span><span class="score-value">${r.framesCorrect}/${r.framesTracked}</span></div>
    </div>
    <div style="font-size:12px;color:#888">逐帧详情：</div>`;

  (r.frameResults || []).forEach(fr => {
    const fc = fr.f1 >= 0.5 ? 'correct' : 'extra';
    html += `<div class="fb-item ${fc}">帧${fr.frame}: P=${(fr.precision*100).toFixed(0)}% R=${(fr.recall*100).toFixed(0)}% F1=${(fr.f1*100).toFixed(0)}% (${fr.tp} 匹配)</div>`;
  });

  resultContent.innerHTML = html;
}

// ── Event mode (video_event) ──
let eventSegments = [];

function loadEventMode(t) {
  eventSegments = [];
  document.getElementById('videoContainer').innerHTML = `
    <div style="text-align:center;padding:40px">
      <p style="font-size:16px;margin-bottom:16px">🎬 视频事件检测模式</p>
      <p style="color:#888;font-size:13px;margin-bottom:20px">拖动下方滑条设置时间段，选择事件标签后点「添加事件」</p>
      <div style="display:flex;gap:12px;align-items:center;justify-content:center;margin-bottom:12px">
        <span style="color:#888;font-size:12px">起始:</span>
        <input type="range" id="segStart" min="0" max="${Math.floor(t.duration*10)}" value="0" style="accent-color:#4fc3f7;width:120px" oninput="updateSegPreview()">
        <span style="color:#4fc3f7;font-family:monospace" id="segStartVal">0.0s</span>
        <span style="color:#888;font-size:12px">结束:</span>
        <input type="range" id="segEnd" min="0" max="${Math.floor(t.duration*10)}" value="${Math.floor(t.duration*10)}" style="accent-color:#f87171;width:120px" oninput="updateSegPreview()">
        <span style="color:#f87171;font-family:monospace" id="segEndVal">${t.duration.toFixed(1)}s</span>
        <button onclick="addEventSeg()" style="padding:8px 16px;border-radius:6px;background:#2563eb;color:#eee;border:none;cursor:pointer">添加事件</button>
      </div>
      <div id="eventPreview" style="background:#0f0f1a;border-radius:8px;border:1px solid #333;padding:16px;min-height:100px">
        <p style="color:#888;font-size:12px">已添加的事件段将显示在此</p>
      </div>
    </div>`;
  document.getElementById('videoContainer').style.display = 'flex';
  document.getElementById('btnSaveFrame').style.display = 'none';
  document.getElementById('info').textContent = t.desc + ' (' + (t.difficulty||'') + ')';
  updateSegPreview();
}

function updateSegPreview() {
  const t = TASKS[currentTask];
  const s = parseFloat(document.getElementById('segStart')?.value || 0) / 10;
  const e = parseFloat(document.getElementById('segEnd')?.value || t.duration * 10) / 10;
  document.getElementById('segStartVal').textContent = s.toFixed(1) + 's';
  document.getElementById('segEndVal').textContent = e.toFixed(1) + 's';
}

function addEventSeg() {
  const s = parseFloat(document.getElementById('segStart').value) / 10;
  const e = parseFloat(document.getElementById('segEnd').value) / 10;
  if (e - s < 0.2) { alert('时间段太短，至少 0.2 秒'); return; }
  eventSegments.push({ start_time: Math.round(s*10)/10, end_time: Math.round(e*10)/10, label: selectedLabel });
  const cn = LABEL_CN[selectedLabel] || selectedLabel;
  const preview = document.getElementById('eventPreview');
  preview.innerHTML = eventSegments.map((seg, i) =>
    `<div class="frame-item"><span>${LABEL_CN[seg.label]||seg.label} [${seg.start_time}s–${seg.end_time}s]</span><span class="del" onclick="eventSegments.splice(${i},1);updateSegPreview();addEventSeg()">✕</span></div>`
  ).join('') || '<p style="color:#888;font-size:12px">已添加的事件段将显示在此</p>';
}

function calcTIoU(a, b) {
  const inter = Math.max(0, Math.min(a.end_time, b.end_time) - Math.max(a.start_time, b.start_time));
  const union = Math.max(a.end_time, b.end_time) - Math.min(a.start_time, b.start_time);
  return union > 0 ? inter / union : 0;
}

function checkEventAnnotation() {
  const t = TASKS[currentTask];
  if (eventSegments.length === 0) { alert('请先添加事件段'); return; }
  const gt = t.gt;

  const pairs = [];
  eventSegments.forEach((p, pi) => gt.forEach((g, gj) => {
    if (p.label !== g.label) continue;
    const tiou = calcTIoU(p, g);
    if (tiou >= 0.3) pairs.push({ tiou, pi, gj });
  }));
  pairs.sort((a,b) => b.tiou - a.tiou);

  const mPred = new Set(), mGt = new Set(), matches = [];
  pairs.forEach(({tiou, pi, gj}) => {
    if (!mPred.has(pi) && !mGt.has(gj)) { matches.push({ pred_idx:pi, gt_idx:gj, tiou }); mPred.add(pi); mGt.add(gj); }
  });

  const tp = matches.length, fp = eventSegments.length - tp, fn = gt.length - tp;
  const precision = tp / eventSegments.length || 0, recall = tp / gt.length || 0;
  const f1 = (2*precision*recall)/(precision+recall) || 0;

  checkResult = { matches, gt, precision, recall, f1, tp, fp, fn, matchedPred: [...mPred], matchedGt: [...mGt] };
  renderEventResults();
  document.getElementById('btnCoach').style.display = 'block';
}

function renderEventResults() {
  if (!checkResult) { resultPanel.classList.remove('show'); return; }
  resultPanel.classList.add('show');
  const r = checkResult;

  let html = `
    <div class="score-card">
      <div class="score-row"><span class="score-label">精确率</span><span class="score-value ${r.precision>=0.7?'good':'warn'}">${(r.precision*100).toFixed(0)}%</span></div>
      <div class="score-row"><span class="score-label">召回率</span><span class="score-value ${r.recall>=0.7?'good':'warn'}">${(r.recall*100).toFixed(0)}%</span></div>
      <div class="score-row"><span class="score-label">F1 分数</span><span class="score-value ${r.f1>=0.7?'good':'warn'}">${(r.f1*100).toFixed(0)}%</span></div>
      <div class="score-row"><span class="score-label">正确 / 应有</span><span>${r.tp} / ${r.gt.length}</span></div>
    </div>`;

  r.matches.forEach(m => {
    const seg = eventSegments[m.pred_idx];
    html += `<div class="fb-item correct">匹配: ${LABEL_CN[seg.label]} [${seg.start_time}s–${seg.end_time}s] — tIoU=${m.tiou.toFixed(2)}</div>`;
  });
  eventSegments.forEach((seg, pi) => {
    if (r.matchedPred.includes(pi)) return;
    html += `<div class="fb-item extra">误报: ${LABEL_CN[seg.label]} [${seg.start_time}s–${seg.end_time}s]</div>`;
  });
  r.gt.forEach((g, gj) => {
    if (r.matchedGt.includes(gj)) return;
    html += `<div class="fb-item missed">漏检: ${LABEL_CN[g.label]||g.label} [${g.start_time}s–${g.end_time}s]</div>`;
  });

  resultContent.innerHTML = html;
}

// ── Common ──
function toggleVideoPlay() {
  if (eventMode) return;
  if (video.paused) { video.play(); document.getElementById('btnVideoPlay').textContent = '⏸ 暂停'; }
  else { video.pause(); document.getElementById('btnVideoPlay').textContent = '▶ 播放'; }
}

function onVideoTime() {
  if (eventMode) return;
  const frame = Math.floor(video.currentTime * (TASKS[currentTask].fps || 1));
  if (frame !== currentFrame && frame < totalFrames) goToFrame(frame);
}

function askCoach() {
  const t = TASKS[currentTask];
  let msg;
  if (eventMode && checkResult) {
    const pct = (checkResult.f1 * 100).toFixed(0);
    msg = `我刚完成了「${t.desc.split('—')[0]}」视频事件检测：\n- F1分数: ${pct}%\n- 我的标注: ${JSON.stringify(eventSegments)}\n请帮我分析一下哪里需要改进。`;
  } else if (checkResult) {
    msg = `我刚完成了「${t.desc.split('—')[0]}」视频目标跟踪：\n- 平均F1: ${(checkResult.f1*100).toFixed(0)}%\n- 帧正确率: ${checkResult.framesCorrect}/${checkResult.framesTracked}\n请帮我分析一下哪里需要改进。`;
  } else { return; }

  localStorage.setItem('annotation_last_result', JSON.stringify({
    taskId: currentTask, taskTitle: t.desc,
    f1: checkResult?.f1 || 0, message: msg, time: Date.now()
  }));
  localStorage.setItem('annotation_pending_message', msg);
  localStorage.setItem('annotation_pending_time', String(Date.now()));
  try { window.parent.location.href = '/home'; } catch(e) { window.top.location.href = '/home'; }
}

// ── Ask Doubt (O8 行内思维快照) ──
// 学生随时标记"这里有疑问"，不必等提交；Coach 优先回应。
function askDoubt() {
  const t = TASKS[currentTask];
  const hasResult = !!checkResult;
  let msg = `⚠ 我有疑问（进行中提问）：「${t.desc.split('—')[0]}」标注练习里，`;
  msg += hasResult
    ? `刚才提交的结果 F1=${(checkResult.f1*100).toFixed(0)}%，但我在以下地方没把握：\n`
    : `我还没提交，但做到这里不确定，想先确认一下：\n`;
  msg += `- 当前任务: ${currentTask}\n- 我画/标的内容: ${JSON.stringify({ group: taskGroup, frames: frameBoxes, events: eventSegments })}\n`;
  msg += `请先解答我的疑问，再告诉我怎么继续。`;

  localStorage.setItem('annotation_pending_message', msg);
  localStorage.setItem('annotation_pending_time', String(Date.now()));
  localStorage.setItem('annotation_doubt', '1');
  if (checkResult) {
    localStorage.setItem('annotation_last_result', JSON.stringify({
      taskId: currentTask, taskTitle: t.desc, f1: checkResult.f1,
      precision: checkResult.precision, recall: checkResult.recall,
      tp: checkResult.tp || checkResult.framesCorrect || 0,
      total: (checkResult.gt && checkResult.gt.length) || 0,
      boxes: frameBoxes, message: msg, time: Date.now(),
    }));
  }
  try { window.parent.location.href = '/home'; } catch(e) { window.top.location.href = '/home'; }
}

loadTask();
