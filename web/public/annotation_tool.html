<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>标注练习工具</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: system-ui; background:#1a1a2e; color:#eee; display:flex; height:100vh; }
.sidebar { width:280px; background:#16213e; padding:16px; display:flex; flex-direction:column; gap:10px; overflow-y:auto; }
.sidebar h2 { font-size:13px; color:#888; text-transform:uppercase; margin-bottom:2px; }
.sidebar select, .sidebar button { width:100%; padding:8px; border-radius:6px; border:1px solid #333; background:#0f3460; color:#eee; cursor:pointer; font-size:13px; }
.sidebar button:hover { background:#1a508b; }
.sidebar button.primary { background:#2563eb; border-color:#2563eb; }
.sidebar button.primary:hover { background:#1d4ed8; }
.sidebar button.coach { background:#7c3aed; border-color:#7c3aed; }
.sidebar button.coach:hover { background:#6d28d9; }
.sidebar button.coach.doubt { background:#d97706; border-color:#d97706; }
.sidebar button.coach.doubt:hover { background:#b45309; }
.label-btns { display:flex; flex-direction:column; gap:6px; }
.label-btn { padding:8px 12px; border:2px solid #333; border-radius:6px; background:transparent; color:#ccc; cursor:pointer; text-align:left; font-size:13px; }
.label-btn.selected { border-color:#4fc3f7; background:rgba(79,195,247,0.15); color:#4fc3f7; }
.main-area { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:16px; position:relative; }
canvas { border:1px solid #444; cursor:crosshair; border-radius:8px; max-width:100%; max-height:72vh; }
.info { margin-top:8px; font-size:12px; color:#888; text-align:center; min-height:20px; }
.result-panel { width:320px; background:#16213e; padding:16px; overflow-y:auto; display:none; }
.result-panel.show { display:block; }
.result-panel h2 { font-size:14px; color:#888; text-transform:uppercase; margin-bottom:10px; }
.score-card { background:#0f3460; border-radius:10px; padding:14px; margin-bottom:10px; }
.score-row { display:flex; justify-content:space-between; align-items:center; padding:4px 0; border-bottom:1px solid #1e293b; }
.score-row:last-child { border:none; }
.score-label { font-size:12px; color:#94a3b8; }
.score-value { font-size:20px; font-weight:700; }
.score-value.good { color:#4ade80; }
.score-value.warn { color:#fbbf24; }
.score-value.bad { color:#f87171; }
.fb-item { padding:8px 10px; border-radius:6px; font-size:12px; margin-bottom:6px; border-left:3px solid; line-height:1.4; }
.fb-item.correct { background:rgba(74,222,128,0.08); border-color:#4ade80; }
.fb-item.wrong { background:rgba(248,113,113,0.08); border-color:#f87171; }
.fb-item.missed { background:rgba(251,191,36,0.08); border-color:#fbbf24; }
.fb-item.extra { background:rgba(250,204,21,0.08); border-color:#facc15; }
.fb-item .icon-text { font-size:13px; font-weight:600; }
.summary { padding:10px; border-radius:8px; font-size:12px; margin-bottom:10px; }
.summary.good { background:rgba(74,222,128,0.1); border:1px solid #4ade80; }
.summary.warn { background:rgba(251,191,36,0.1); border:1px solid #fbbf24; }
.summary.bad { background:rgba(248,113,113,0.1); border:1px solid #f87171; }
.legend { display:flex; gap:10px; font-size:10px; color:#888; margin-bottom:8px; flex-wrap:wrap; }
.legend span { display:flex; align-items:center; gap:3px; }
.legend .dot { width:10px; height:10px; border-radius:2px; display:inline-block; }
.banner { background:rgba(217,119,6,0.15); border:1px solid #d97706; color:#fbbf24; padding:8px 12px; border-radius:8px; font-size:13px; margin-bottom:10px; text-align:center; display:none; }
.ai-tools { display:none; flex-direction:column; gap:6px; }
.ai-tools button.accept { background:#b45309; border-color:#b45309; }
.ai-tools button.accept:hover { background:#92400e; }
.ai-tools button.clear-ai { background:transparent; border-color:#d97706; color:#fbbf24; }
.ai-tools button.clear-ai:hover { background:rgba(217,119,6,0.15); }
.edit-hint { font-size:11px; color:#888; margin-top:2px; text-align:center; }
</style>
</head>
<body>

<div class="sidebar">
  <h2>选择任务</h2>
   <select id="taskSelect" onchange="loadTask()">
     <option value="task1">任务1: 街景找车 (★简单)</option>
     <option value="task2">任务2: 停车场找车 (★★中等)</option>
     <option value="task3">任务3: 车辆特写 (★简单)</option>
     <option value="task4">任务4: 找马 (★★中等)</option>
     <option value="task5">任务5: 动物分类 (★简单-NEW)</option>
     <option value="task6">任务6: 遮挡场景 (★★★困难)</option>
     <option value="task7">任务7: 密集小目标 (★★★困难)</option>
     <option value="task8">任务8: 精度挑战 (★★★困难)</option>
   </select>
  
  <h2>选择标签</h2>
  <div class="label-btns" id="labelBtns"></div>
  
  <button class="primary" onclick="checkAnnotation()">检查标注</button>
  <button onclick="undoBox()">撤销</button>
  <button onclick="clearBoxes()">清除全部</button>
  <div class="ai-tools" id="aiTools">
    <button class="accept" onclick="acceptAllAI()">🤖 全部接受</button>
    <button class="clear-ai" onclick="clearAllAI()">清除 AI 预标注</button>
  </div>
  <button class="coach" id="btnCoach" onclick="askCoach()" style="display:none">问Coach：帮我分析</button>
  <button class="coach doubt" id="btnDoubt" onclick="askDoubt()">这里有疑问</button>
</div>

<div class="main-area">
  <div class="banner" id="preBanner"></div>
  <canvas id="canvas"></canvas>
  <div class="info" id="info">在图片上拖动画框，选好标签后点「检查标注」</div>
  <div class="edit-hint" id="editHint">点击框可选中/拖动，拖角缩放，按 Delete 删除</div>
</div>

<div class="result-panel" id="resultPanel">
  <div class="legend">
    <span><span class="dot" style="background:#4ade80"></span> 匹配</span>
    <span><span class="dot" style="background:#f87171"></span> 标签错</span>
    <span><span class="dot" style="background:#fbbf24"></span> 漏标/多余</span>
  </div>
  <div id="resultContent"></div>
</div>

<script>
const TASKS = {
  task1: { url:'/images/car2.jpeg', labels:['car'], w:640, h:430, desc:'街景 — 找到车并画框 (1辆)', difficulty:'简单',
    gt: [{"x":207,"y":140,"w":353,"h":273,"label":"car"}] },
  task2: { url:'/images/car4.jpeg', labels:['car'], w:1080, h:659, desc:'停车场 — 找到所有车 (4辆)', difficulty:'中等',
    gt: [{"x":187,"y":351,"w":144,"h":140,"label":"car"},{"x":431,"y":308,"w":89,"h":109,"label":"car"},{"x":664,"y":409,"w":138,"h":137,"label":"car"},{"x":564,"y":141,"w":71,"h":35,"label":"car"}] },
  task3: { url:'/images/car1.jpeg', labels:['car'], w:2048, h:1536, desc:'车辆特写 — 画出整车轮廓', difficulty:'简单',
    gt: [{"x":527,"y":52,"w":871,"h":813,"label":"car"}] },
  task4: { url:'/images/2.jpeg', labels:['horse'], w:720, h:480, desc:'找马 — 标注所有马匹 (4匹)', difficulty:'中等',
    gt: [{"x":0,"y":157,"w":88,"h":116,"label":"horse"},{"x":433,"y":74,"w":181,"h":358,"label":"horse"},{"x":26,"y":121,"w":292,"h":295,"label":"horse"},{"x":313,"y":130,"w":116,"h":291,"label":"horse"}] },
  task5: { url:'/images/car2.jpeg', labels:['car','not_car'], w:640, h:430, desc:'图片分类 — 判断图中是否有汽车', difficulty:'简单', type:'classification',
    gt: {"label":"car"} },
  task6: { url:'/images/car4.jpeg', labels:['car'], w:1080, h:659, desc:'遮挡场景 — 被遮挡的车也要标注 (4辆，含遮挡)', difficulty:'困难',
    gt: [{"x":187,"y":351,"w":144,"h":140,"label":"car"},{"x":431,"y":308,"w":89,"h":109,"label":"car"},{"x":664,"y":409,"w":138,"h":137,"label":"car"},{"x":564,"y":141,"w":71,"h":35,"label":"car"}] },
  task7: { url:'/images/car4.jpeg', labels:['car'], w:1080, h:659, desc:'密集目标 — 找出所有车辆，包括远处小的', difficulty:'困难',
    gt: [{"x":187,"y":351,"w":144,"h":140,"label":"car"},{"x":431,"y":308,"w":89,"h":109,"label":"car"},{"x":664,"y":409,"w":138,"h":137,"label":"car"},{"x":564,"y":141,"w":71,"h":35,"label":"car"}] },
  task8: { url:'/images/car1.jpeg', labels:['car'], w:2048, h:1536, desc:'精度挑战 — 框边距 ≤ 3px，IOU ≥ 0.95', difficulty:'困难',
    gt: [{"x":527,"y":52,"w":871,"h":813,"label":"car"}] },
};

const COLORS = { car:'#E74C3C', horse:'#8E44AD', not_car:'#95A5A6' };
const LABEL_CN = { car:'车', horse:'马', not_car:'非车' };

let currentTask = 'task1', selectedLabel = '', boxes = [], drawing = null, start = null, checkResult = null;
let preAnnotation = null, selectedBox = -1, dragMode = null, dragStart = null;
let img = new Image();
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const resultPanel = document.getElementById('resultPanel');
const resultContent = document.getElementById('resultContent');
const AI_COLOR = '#d97706';

function loadTask() {
  currentTask = document.getElementById('taskSelect').value;
  const t = TASKS[currentTask];
  if (t.type === 'classification') {
    loadClassificationTask(t);
    return;
  }
  selectedLabel = t.labels[0];
  boxes = []; checkResult = null; preAnnotation = null; selectedBox = -1; dragMode = null;
  resultPanel.classList.remove('show');
  document.getElementById('btnCoach').style.display = 'none';
  const pb = document.getElementById('preBanner'), at = document.getElementById('aiTools'), eh = document.getElementById('editHint');
  if (pb) pb.style.display = 'none';
  if (at) at.style.display = 'none';
  if (eh) eh.style.display = 'none';
  renderLabels();
  img.onload = () => { canvas.width = t.w; canvas.height = t.h; loadPreAnnotation(); draw(); };
  img.src = t.url;
  document.getElementById('info').textContent = t.desc + ' (' + (t.difficulty||'') + ')';
}

function loadPreAnnotation() {
  let data = null;
  try {
    const raw = localStorage.getItem('annotation_pre_annotation');
    if (raw) data = JSON.parse(raw);
  } catch(e) { data = null; }
  if (!data || !Array.isArray(data.pre) || data.taskId !== currentTask) return;
  preAnnotation = data;
  data.pre.forEach(p => {
    boxes.push({ x:Math.round(p.x), y:Math.round(p.y), w:Math.round(p.w), h:Math.round(p.h), label:p.label, isAi:true });
  });
  const mode = data.mode === 'find_error' ? 'find_error' : 'review';
  const banner = document.getElementById('preBanner');
  banner.style.display = 'block';
  banner.textContent = mode === 'review'
    ? '🤖 AI 预标注：请审阅确认或修正'
    : '🤖 AI 预标注：请找出它的错误';
  document.getElementById('aiTools').style.display = 'flex';
  document.getElementById('editHint').style.display = 'block';
  selectedBox = boxes.length - 1;
  updateCheckButtons();
}

function renderLabels() {
  const t = TASKS[currentTask];
  document.getElementById('labelBtns').innerHTML = t.labels.map(l => {
    const c = COLORS[l] || '#888', cn = LABEL_CN[l] || l;
    return `<button class="label-btn${selectedLabel===l?' selected':''}" onclick="selectLabel('${l}')" style="border-left:4px solid ${c}">${cn} (${l})</button>`;
  }).join('');
}

function selectLabel(l) { selectedLabel = l; renderLabels(); }

function calcIOU(a, b) {
  const ix = Math.max(0, Math.min(a.x+a.w, b.x+b.w) - Math.max(a.x, b.x));
  const iy = Math.max(0, Math.min(a.y+a.h, b.y+b.h) - Math.max(a.y, b.y));
  const u = (a.w*a.h) + (b.w*b.h) - ix*iy;
  return u > 0 ? (ix*iy)/u : 0;
}

function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(img,0,0);
  
  // Draw boxes (AI pre-annotation boxes are dashed amber with an AI badge)
  boxes.forEach((b, bi) => {
    if (b.isAi) {
      ctx.setLineDash([8,4]);
      ctx.strokeStyle = AI_COLOR; ctx.lineWidth = 2.5;
      ctx.strokeRect(b.x,b.y,b.w,b.h);
      ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(217,119,6,0.12)'; ctx.fillRect(b.x,b.y,b.w,b.h);
      const badgeW = 28, badgeH = 16;
      ctx.fillStyle = AI_COLOR;
      ctx.fillRect(Math.max(0,b.x), Math.max(0,b.y-badgeH), badgeW, badgeH);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 11px system-ui'; ctx.textAlign = 'left';
      ctx.fillText('AI', Math.max(0,b.x)+4, Math.max(0,b.y-badgeH)+12);
      ctx.textAlign = 'start';
    } else {
      ctx.strokeStyle = COLORS[b.label]||'#888'; ctx.lineWidth = 2;
      ctx.strokeRect(b.x,b.y,b.w,b.h);
      ctx.fillStyle = (COLORS[b.label]||'#888')+'15'; ctx.fillRect(b.x,b.y,b.w,b.h);
    }
    if (bi === selectedBox) drawHandles(b);
  });
  
  // Draw GT after check
  if (checkResult) {
    checkResult.gt.forEach((gt, gj) => {
      const matched = checkResult.matchedGt && checkResult.matchedGt.includes(gj);
      ctx.setLineDash(matched ? [] : [8,4]);
      ctx.strokeStyle = matched ? '#4ade80' : '#fbbf24';
      ctx.lineWidth = matched ? 3 : 2.5;
      ctx.strokeRect(gt.x, gt.y, gt.w, gt.h);
      ctx.setLineDash([]);
      if (!matched) {
        ctx.fillStyle = '#fbbf24'; ctx.font = 'bold 14px system-ui';
        const txt = '漏标!';
        ctx.fillText(txt, gt.x+4, gt.y-6);
      }
    });
  }
  
  if (drawing) {
    ctx.strokeStyle = COLORS[selectedLabel]||'#888'; ctx.lineWidth = 3;
    ctx.strokeRect(drawing.x, drawing.y, drawing.w, drawing.h);
    ctx.fillStyle = (COLORS[selectedLabel]||'#888')+'20';
    ctx.fillRect(drawing.x, drawing.y, drawing.w, drawing.h);
  }
}

function drawHandles(b) {
  ctx.strokeStyle = '#4fc3f7'; ctx.lineWidth = 2;
  ctx.strokeRect(b.x-3, b.y-3, b.w+6, b.h+6);
  ctx.fillStyle = '#4fc3f7';
  [[b.x,b.y],[b.x+b.w,b.y],[b.x,b.y+b.h],[b.x+b.w,b.y+b.h]].forEach(([hx,hy]) => {
    ctx.fillRect(hx-4, hy-4, 8, 8);
  });
}

canvas.addEventListener('mousedown', e => {
  if (checkResult) return;
  const r = canvas.getBoundingClientRect();
  const mx = (e.clientX-r.left)*canvas.width/r.width, my = (e.clientY-r.top)*canvas.height/r.height;

  const handle = hitTestHandle(mx, my);
  if (selectedBox >= 0 && handle) {
    dragMode = 'resize';
    dragStart = { mx, my, handle, x:boxes[selectedBox].x, y:boxes[selectedBox].y, w:boxes[selectedBox].w, h:boxes[selectedBox].h };
    draw();
    return;
  }
  const hitIdx = hitTestBox(mx, my);
  if (hitIdx >= 0) {
    selectedBox = hitIdx;
    dragMode = 'move';
    dragStart = { mx, my, x:boxes[hitIdx].x, y:boxes[hitIdx].y };
    draw();
    return;
  }
  selectedBox = -1;
  start = { x:mx, y:my };
  drawing = { x:start.x, y:start.y, w:0, h:0 };
  draw();
});
canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  const mx = (e.clientX-r.left)*canvas.width/r.width, my = (e.clientY-r.top)*canvas.height/r.height;
  if (dragMode && selectedBox >= 0) {
    const b = boxes[selectedBox], d = dragStart;
    if (dragMode === 'move') {
      b.x = Math.round(d.x + mx - d.mx); b.y = Math.round(d.y + my - d.my);
    } else if (dragMode === 'resize') {
      let x = d.x, y = d.y, w = d.w, h = d.h;
      if (d.handle.includes('e')) w = Math.max(8, d.w + mx - d.mx);
      if (d.handle.includes('s')) h = Math.max(8, d.h + my - d.my);
      if (d.handle.includes('w')) { w = Math.max(8, d.w + d.mx - mx); x = d.x + d.w - w; }
      if (d.handle.includes('n')) { h = Math.max(8, d.h + d.my - my); y = d.y + d.h - h; }
      b.x = Math.round(x); b.y = Math.round(y); b.w = Math.round(w); b.h = Math.round(h);
    }
    draw();
    return;
  }
  if (!drawing) return;
  drawing.x = Math.min(start.x,mx); drawing.y = Math.min(start.y,my);
  drawing.w = Math.abs(mx-start.x); drawing.h = Math.abs(my-start.y);
  draw();
});
canvas.addEventListener('mouseup', () => {
  if (dragMode) { dragMode = null; draw(); return; }
  if (!drawing || drawing.w < 8 || drawing.h < 8) { drawing = null; draw(); return; }
  boxes.push({ x:Math.round(drawing.x), y:Math.round(drawing.y), w:Math.round(drawing.w), h:Math.round(drawing.h), label:selectedLabel });
  drawing = null; draw();
});

document.addEventListener('keydown', e => {
  if ((e.key === 'Delete' || e.key === 'Backspace') && selectedBox >= 0 && selectedBox < boxes.length) {
    e.preventDefault();
    boxes.splice(selectedBox, 1);
    selectedBox = -1; checkResult = null; dragMode = null;
    draw(); renderResults(); updateCheckButtons();
  }
});

function hitTestBox(mx, my) {
  for (let i = boxes.length-1; i >= 0; i--) {
    const b = boxes[i];
    if (mx >= b.x && mx <= b.x+b.w && my >= b.y && my <= b.y+b.h) return i;
  }
  return -1;
}

function hitTestHandle(mx, my) {
  if (selectedBox < 0) return null;
  const b = boxes[selectedBox];
  const pts = {
    'nw': [b.x, b.y], 'ne': [b.x+b.w, b.y],
    'sw': [b.x, b.y+b.h], 'se': [b.x+b.w, b.y+b.h]
  };
  for (const [k,[hx,hy]] of Object.entries(pts)) {
    if (Math.abs(mx-hx) <= 8 && Math.abs(my-hy) <= 8) return k;
  }
  return null;
}

function undoBox() { if (!boxes.length) return; boxes.pop(); selectedBox = -1; checkResult = null; draw(); renderResults(); updateCheckButtons(); }
function clearBoxes() { boxes = []; selectedBox = -1; checkResult = null; draw(); renderResults(); updateCheckButtons(); }

function updateCheckButtons() {
  const aiCount = boxes.filter(b => b.isAi).length;
  const at = document.getElementById('aiTools'), eh = document.getElementById('editHint'), pb = document.getElementById('preBanner');
  if (at) at.style.display = aiCount > 0 ? 'flex' : 'none';
  if (eh) eh.style.display = aiCount > 0 ? 'block' : 'none';
  if (pb) pb.style.display = aiCount > 0 ? 'block' : 'none';
}

function acceptAllAI() {
  boxes.forEach(b => { if (b.isAi) { b.isAi = false; } });
  selectedBox = -1; checkResult = null; draw(); renderResults(); updateCheckButtons();
}

function clearAllAI() {
  boxes = boxes.filter(b => !b.isAi);
  selectedBox = -1; checkResult = null; draw(); renderResults(); updateCheckButtons();
}

function checkAnnotation() {
  if (boxes.length === 0) { alert('请先在图片上画框'); return; }
  const t = TASKS[currentTask], gt = t.gt;
  
  const pairs = [];
  boxes.forEach((p, pi) => gt.forEach((g, gj) => {
    if (p.label !== g.label) return;
    const iou = calcIOU(p, g);
    if (iou >= 0.5) pairs.push({ iou, pi, gj });
  }));
  pairs.sort((a,b) => b.iou - a.iou);
  
  const mPred = new Set(), mGt = new Set(), matches = [];
  pairs.forEach(({iou, pi, gj}) => {
    if (!mPred.has(pi) && !mGt.has(gj)) { matches.push({ pred_idx:pi, gt_idx:gj, iou }); mPred.add(pi); mGt.add(gj); }
  });
  
  const tp = matches.length, fp = boxes.length - tp, fn = gt.length - tp;
  const precision = tp / boxes.length || 0, recall = tp / gt.length || 0;
  const f1 = (2*precision*recall)/(precision+recall) || 0;
  
  checkResult = { matches, gt, precision, recall, f1, tp, fp, fn, matchedPred: [...mPred], matchedGt: [...mGt] };
  draw();
  renderResults();
  document.getElementById('btnCoach').style.display = 'block';
}

function positionHint(x, y) {
  // Make coordinates human-readable
  const cw = canvas.width, ch = canvas.height;
  let hPos = x < cw/3 ? '左侧' : x > 2*cw/3 ? '右侧' : '中央';
  let vPos = y < ch/3 ? '上部' : y > 2*ch/3 ? '下部' : '中部';
  return `${vPos}${hPos}`;
}

function renderResults() {
  if (!checkResult) { resultPanel.classList.remove('show'); return; }
  resultPanel.classList.add('show');
  
  const r = checkResult, t = TASKS[currentTask];
  const f1c = r.f1 >= 0.7 ? 'good' : r.f1 >= 0.4 ? 'warn' : 'bad';
  const pc = r.precision >= 0.7 ? 'good' : r.precision >= 0.4 ? 'warn' : 'bad';
  const rc = r.recall >= 0.7 ? 'good' : r.recall >= 0.4 ? 'warn' : 'bad';
  const sc = r.f1 >= 0.7 ? 'good' : r.f1 >= 0.4 ? 'warn' : 'bad';
  const msg = r.f1 >= 0.7 ? '标注质量不错！可以试试更难的题。' : r.f1 >= 0.4 ? '还需要改进，注意漏掉的目标。' : '偏差较大，建议仔细重新标注。';
  
  let html = `
    <div class="score-card">
      <div class="score-row"><span class="score-label">精确率 Precision</span><span class="score-value ${pc}">${(r.precision*100).toFixed(0)}%</span></div>
      <div class="score-row"><span class="score-label">召回率 Recall</span><span class="score-value ${rc}">${(r.recall*100).toFixed(0)}%</span></div>
      <div class="score-row"><span class="score-label">F1 分数</span><span class="score-value ${f1c}">${(r.f1*100).toFixed(0)}%</span></div>
      <div class="score-row"><span class="score-label">正确 / 应标</span><span style="font-size:15px;color:#e2e8f0">${r.tp} / ${r.gt.length}</span></div>
    </div>
    <div class="summary ${sc}">${msg}</div>`;
  
  const mps = new Set(r.matchedPred || []), mgs = new Set(r.matchedGt || []);
  
  r.matches.forEach(m => {
    const pred = boxes[m.pred_idx];
    const cn = LABEL_CN[pred.label] || pred.label;
    html += `<div class="fb-item correct"><span class="icon-text">匹配: ${cn}</span> — IOU=${m.iou.toFixed(2)}</div>`;
  });
  
  boxes.forEach((pred, pi) => {
    if (mps.has(pi)) return;
    const bestMatch = r.gt.find(g => calcIOU(pred, g) >= 0.5);
    const cn = LABEL_CN[pred.label] || pred.label;
    if (bestMatch) {
      const bcn = LABEL_CN[bestMatch.label] || bestMatch.label;
      html += `<div class="fb-item wrong"><span class="icon-text">标签错了:</span> 你标了「${cn}」，实际应该是「${bcn}」。位置是对的，改下标签就行。</div>`;
    } else {
      html += `<div class="fb-item extra"><span class="icon-text">多余框:</span> 你画的「${cn}」在图上没有对应目标。图上黄色虚线框标出了你漏掉的目标。</div>`;
    }
  });
  
  r.gt.forEach((g, gj) => {
    if (mgs.has(gj)) return;
    const cn = LABEL_CN[g.label] || g.label;
    const hint = positionHint(g.x, g.y);
    html += `<div class="fb-item missed"><span class="icon-text">漏标:</span> 图片${hint}有一个「${cn}」你没标出来。看图上黄色虚线框的位置。</div>`;
  });
  
  resultContent.innerHTML = html;
}

// ── Ask Coach ──
function askCoach() {
  if (!checkResult) return;
  const t = TASKS[currentTask];
  
  // Build a structured message for the Coach
  const pct = (checkResult.f1 * 100).toFixed(0);
  const pText = checkResult.f1 >= 0.7 ? '不错' : checkResult.f1 >= 0.4 ? '一般' : '需要改进';
  
  const msg = `我刚完成了「${t.desc.split('—')[0]}」标注练习：
- 精确率: ${(checkResult.precision*100).toFixed(0)}%
- 召回率: ${(checkResult.recall*100).toFixed(0)}%  
- F1分数: ${pct}% (${pText})
- 正确: ${checkResult.tp}/${checkResult.gt.length}
- 我画的框: ${JSON.stringify(boxes)}
请帮我分析一下哪里需要改进，推荐下一步学什么。`;
  
  // Save to localStorage for the chat page to read
  const resultPayload = {
    taskId: currentTask,
    taskTitle: t.desc,
    f1: checkResult.f1,
    precision: checkResult.precision,
    recall: checkResult.recall,
    tp: checkResult.tp,
    total: checkResult.gt.length,
    boxes: boxes,
    message: msg,
    time: Date.now()
  };
  if (preAnnotation) {
    resultPayload.pre_annotation = preAnnotation.pre.map(p => ({ x:p.x, y:p.y, w:p.w, h:p.h, label:p.label }));
    resultPayload.pre_annotation_mode = preAnnotation.mode === 'find_error' ? 'find_error' : 'review';
  }
  localStorage.setItem('annotation_last_result', JSON.stringify(resultPayload));
  
  // Also save the message separately for easy sending
  localStorage.setItem('annotation_pending_message', msg);
  localStorage.setItem('annotation_pending_time', String(Date.now()));
  
  // Navigate to chat
  try {
    window.parent.location.href = '/home';
  } catch(e) {
    window.top.location.href = '/home';
  }
}

// ── Ask Doubt (O8 行内思维快照) ──
// 学生随时标记"这里有疑问"，不必等提交；Coach 优先回应。
function askDoubt() {
  const t = TASKS[currentTask];
  const hasResult = !!checkResult;
  let msg = `⚠ 我有疑问（进行中提问）：「${t.desc.split('—')[0]}」标注练习里，`;
  msg += hasResult
    ? `刚才提交的结果 F1=${(checkResult.f1*100).toFixed(0)}%，但我在以下地方没把握：\n`
    : `我还没提交，但做到这里不确定，想先确认一下：\n`;
  msg += `- 当前任务: ${currentTask}\n- 我画/标的内容: ${JSON.stringify(boxes || [])}\n`;
  msg += `请先解答我的疑问，再告诉我怎么继续。`;

  localStorage.setItem('annotation_pending_message', msg);
  localStorage.setItem('annotation_pending_time', String(Date.now()));
  localStorage.setItem('annotation_doubt', '1');
  if (checkResult) {
    const doubtPayload = {
      taskId: currentTask, taskTitle: t.desc, f1: checkResult.f1,
      precision: checkResult.precision, recall: checkResult.recall,
      tp: checkResult.tp || 0, total: (checkResult.gt && checkResult.gt.length) || 0,
      boxes: boxes, message: msg, time: Date.now(),
    };
    if (preAnnotation) {
      doubtPayload.pre_annotation = preAnnotation.pre.map(p => ({ x:p.x, y:p.y, w:p.w, h:p.h, label:p.label }));
      doubtPayload.pre_annotation_mode = preAnnotation.mode === 'find_error' ? 'find_error' : 'review';
    }
    localStorage.setItem('annotation_last_result', JSON.stringify(doubtPayload));
  }
  try { window.parent.location.href = '/home'; } catch(e) { window.top.location.href = '/home'; }
}

// 检测是否从chat切回来时带有上一次的结果
function checkStoredResult() {
  const stored = localStorage.getItem('annotation_last_result');
  if (stored) {
    document.getElementById('btnCoach').style.display = 'block';
    document.getElementById('info').textContent = '上次检查有结果，点「问Coach」让AI帮你分析';
  }
}

// ========== 分类任务支持 ==========
let classificationAnswer = null;
let classificationConfidence = null;
function loadClassificationTask(t) {
  boxes = []; checkResult = null; classificationAnswer = null;
  preAnnotation = null; selectedBox = -1; dragMode = null;
  resultPanel.classList.remove('show');
  document.getElementById('btnCoach').style.display = 'none';
  
  const main = document.querySelector('.main-area');
  const labelsHtml = t.labels.map(l => {
    const cn = LABEL_CN[l] || l;
    return `<button class="classify-btn" onclick="selectClassification('${l}', this)" style="padding:12px 24px;margin:6px;border:2px solid #333;border-radius:8px;background:#0f3460;color:#eee;cursor:pointer;font-size:14px">${cn}</button>`;
  }).join('');
  
  main.innerHTML = `
    <div style="text-align:center">
      <img src="${t.url}" style="max-width:70%;max-height:400px;border-radius:10px;border:1px solid #444" onerror="this.src='${t.url}'">
      <h3 style="margin:16px 0 8px">${t.desc}</h3>
      <p style="color:#888;font-size:12px;margin-bottom:12px">选择你认为正确的类别：</p>
      <div id="classifyBtns">${labelsHtml}</div>
      <div style="margin-top:12px">
        <label style="font-size:12px;color:#888">置信度（选填）：</label>
        <input type="range" min="1" max="10" value="8" id="confidence" style="vertical-align:middle;width:160px">
        <span style="font-size:12px;color:#888" id="confLabel">80%</span>
      </div>
      <button class="primary" onclick="checkClassification()" style="margin-top:16px;padding:10px 32px;border-radius:8px;background:#2563eb;color:#eee;border:none;cursor:pointer;font-size:14px">提交分类</button>
      <div id="classifyResult" style="margin-top:12px"></div>
    </div>
  `;
  
  document.getElementById('confidence').addEventListener('input', function() {
    document.getElementById('confLabel').textContent = (this.value * 10) + '%';
    classificationConfidence = this.value / 10;
  });
  
  document.getElementById('info').textContent = t.desc + ' (' + (t.difficulty||'') + ') - 选择类别';
}

function selectClassification(label, btn) {
  document.querySelectorAll('.classify-btn').forEach(b => b.style.borderColor = '#333');
  btn.style.borderColor = '#4fc3f7';
  classificationAnswer = label;
}

function checkClassification() {
  if (!classificationAnswer) { alert('请先选择一个类别'); return; }
  const gt = TASKS[currentTask].gt;
  const isCorrect = classificationAnswer === gt.label;
  const cn = LABEL_CN[classificationAnswer] || classificationAnswer;
  const gtCn = LABEL_CN[gt.label] || gt.label;
  
  document.getElementById('classifyResult').innerHTML = isCorrect
    ? `<div style="background:rgba(74,222,128,0.1);border:1px solid #4ade80;padding:16px;border-radius:8px">
         <h3 style="color:#4ade80;margin:0">✓ 回答正确！</h3>
         <p>你选择了「${cn}」，正确答案是「${gtCn}」</p>
       </div>`
    : `<div style="background:rgba(248,113,113,0.1);border:1px solid #f87171;padding:16px;border-radius:8px">
         <h3 style="color:#f87171;margin:0">✗ 回答错误</h3>
         <p>你选择了「${cn}」，正确答案是「${gtCn}」</p>
         <p style="color:#888;font-size:12px">提示：仔细观察图片内容再做判断</p>
       </div>`;
  
  const result = {
    type: 'classification', taskTitle: TASKS[currentTask].desc,
    accuracy: isCorrect ? '100%' : '0%', correct: isCorrect,
    answer: classificationAnswer, correctAnswer: gt.label,
    confidence: classificationConfidence || 0.8
  };
  localStorage.setItem('annotation_last_result', JSON.stringify(result));
  document.getElementById('btnCoach').style.display = 'block';
  document.getElementById('info').textContent = isCorrect ? '正确！点「问Coach」继续下一个任务' : '不正确。点「问Coach」了解为什么';
}

loadTask();
checkStoredResult();
</script>
